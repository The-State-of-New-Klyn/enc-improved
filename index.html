<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES-256-CBC (Z85)</title>
    <script src="code.js"></script>
    <style>
        
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; }
        textarea { width: 100%; font-family: monospace; }
        .button-group { margin: 15px 0; }
        button { padding: 10px 15px; margin-right: 10px; cursor: pointer; }
        .result-section { margin-top: 20px; }
        #resultText { resize: vertical; min-height: 200px; }
        .stego-section { border: 1px solid #ccc; padding: 15px; margin-top: 20px; background: #f9f9f9; }
        .file-input { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Advanced Encryption Standard</h1>
    <p>Release 2.1.</p>

    <label for="inputText">Введите текст для шифрования или дешифрования:</label><br>
    <textarea id="inputText" rows="6"></textarea><br>

    <label for="key">Введите ключ:</label><br>
    <input type="text" id="key" style="width: 100%; padding: 8px;"><br>

    <div class="button-group">
        <button onclick="encryptText()">🔒 Зашифровать</button>
        <button onclick="decryptText()">🔓 Дешифровать</button>
        <button onclick="downloadResultFile()">⬇️ Скачать .txt</button>
        <button onclick="copyToClipboard()">📋 Копировать</button>
    </div>

    <div class="result-section">
        <h2>Результат:</h2>
        <textarea id="resultText" readonly></textarea>
        <p><small id="charCount">Символов: 0</small></p>
    </div>

    <hr>

    <div class="stego-section">
        <h2>📸 Стеганография (PNG - LSB)</h2>
        <p>Выберите PNG‑изображение, затем:</p>
        <div class="file-input">
            <input type="file" id="stegoFileInput" accept="image/png">
        </div>
        <div class="button-group">
            <button onclick="hideToPNG()">📥 Спрятать (зашифрованный текст) в PNG</button>
            <button onclick="extractAndDecrypt()">📤 Извлечь из PNG и расшифровать</button>
        </div>
        <p><small>При встраивании используется текущий зашифрованный текст из поля «Результат».</small></p>
    </div>

    <hr>
    <h2>Шифрование файлов (AES + Base85)</h2>
    <input type="file" id="fileInput">
    <div class="button-group">
        <button onclick="encryptFile()">🔒 Зашифровать файл</button>
        <button onclick="decryptFile()">🔓 Дешифровать .enc</button>
    </div>

    <script>
        const B85_CHARS = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ.-:+=^!/*?&<>()[]{}@%$#";

        function toBase85(wordArray) {
            const words = wordArray.words;
            const sigBytes = wordArray.sigBytes;
            let base85Str = "";
            const padding = (4 - (sigBytes % 4)) % 4;
            const totalBytes = sigBytes + padding;
            for (let i = 0; i < totalBytes; i += 4) {
                const wIdx = i >>> 2;
                const word = words[wIdx] || 0;
                let b1 = (word >>> 24) & 0xff;
                let b2 = (word >>> 16) & 0xff;
                let b3 = (word >>> 8) & 0xff;
                let b4 = word & 0xff;
                if (i + 1 >= sigBytes && padding > 2) b2 = 0;
                if (i + 2 >= sigBytes && padding > 1) b3 = 0;
                if (i + 3 >= sigBytes && padding > 0) b4 = 0;
                let val = ((b1 << 24) >>> 0) + (b2 << 16) + (b3 << 8) + b4;
                let chunk = "";
                for (let j = 0; j < 5; j++) {
                    chunk = B85_CHARS[val % 85] + chunk;
                    val = Math.floor(val / 85);
                }
                base85Str += chunk;
            }
            return base85Str + padding;
        }

        function fromBase85(str) {
            if (!str) return CryptoJS.lib.WordArray.create();
            const padding = parseInt(str.slice(-1), 10);
            const b85Data = str.slice(0, -1);
            if (b85Data.length % 5 !== 0) throw new Error("Неверная длина Base85 строки");
            const words = [];
            for (let i = 0; i < b85Data.length; i += 5) {
                let val = 0;
                for (let j = 0; j < 5; j++) {
                    const code = B85_CHARS.indexOf(b85Data[i + j]);
                    if (code === -1) throw new Error("Недопустимый символ в Base85");
                    val = val * 85 + code;
                }
                words.push(val | 0);
            }
            const sigBytes = (words.length * 4) - padding;
            return CryptoJS.lib.WordArray.create(words, sigBytes);
        }

        function arrayBufferToWordArray(ab) {
            const u8 = new Uint8Array(ab);
            const words = [];
            for (let i = 0; i < u8.length; i++) {
                words[i >>> 2] |= u8[i] << (24 - (i % 4) * 8);
            }
            return CryptoJS.lib.WordArray.create(words, u8.length);
        }

        function wordArrayToUint8Array(wordArray) {
            const words = wordArray.words;
            const sigBytes = wordArray.sigBytes;
            const u8 = new Uint8Array(sigBytes);
            for (let i = 0; i < sigBytes; i++) {
                u8[i] = (words[i >>> 2] >>> (24 - (i % 4) * 8)) & 0xff;
            }
            return u8;
        }

        async function encryptText() {
            const inputText = document.getElementById('inputText').value;
            const password = document.getElementById('key').value;
            if (!inputText || !password) {
                alert("Введите текст и ключ.");
                return;
            }
            try {
                const salt = CryptoJS.lib.WordArray.random(16);
                const iv = CryptoJS.lib.WordArray.random(16);
                const key = CryptoJS.PBKDF2(password, salt, {
                    keySize: 256 / 32,
                    iterations: 100000,
                    hasher: CryptoJS.algo.SHA256
                });
                const encrypted = CryptoJS.AES.encrypt(inputText, key, {
                    iv: iv,
                    mode: CryptoJS.mode.CBC,
                    padding: CryptoJS.pad.Pkcs7
                });
                const combined = salt.clone().concat(iv).concat(encrypted.ciphertext);
                const result = toBase85(combined);
                document.getElementById('resultText').value = result;
                updateCharCount();
                document.getElementById('inputText').value = "";
            } catch (e) {
                alert("Ошибка шифрования: " + e.message);
            }
        }

        async function decryptText() {
            const input = document.getElementById('inputText').value.trim();
            const password = document.getElementById('key').value;
            if (!input || !password) {
                alert("Пожалуйста, введите текст и ключ для дешифрования.");
                return;
            }
            try {
                const combined = fromBase85(input);
                const salt = CryptoJS.lib.WordArray.create(combined.words.slice(0, 4), 16);
                const iv = CryptoJS.lib.WordArray.create(combined.words.slice(4, 8), 16);
                const cipherBytes = CryptoJS.lib.WordArray.create(combined.words.slice(8), combined.sigBytes - 32);
                const key = CryptoJS.PBKDF2(password, salt, {
                    keySize: 256 / 32,
                    iterations: 100000,
                    hasher: CryptoJS.algo.SHA256
                });
                const decrypted = CryptoJS.AES.decrypt(
                    { ciphertext: cipherBytes },
                    key,
                    { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
                );
                const originalText = decrypted.toString(CryptoJS.enc.Utf8);
                if (originalText) {
                    document.getElementById('resultText').value = originalText;
                    updateCharCount();
                } else {
                    alert("Неверный ключ или данные повреждены.");
                }
            } catch (e) {
                alert("Ошибка дешифрования: " + e.message);
            }
        }

        async function encryptFile() {
            const file = document.getElementById('fileInput').files[0];
            const password = document.getElementById('key').value;
            if (!file || !password) {
                alert("Выберите файл и введите ключ.");
                return;
            }
            try {
                const buffer = await file.arrayBuffer();
                const salt = CryptoJS.lib.WordArray.random(16);
                const iv = CryptoJS.lib.WordArray.random(16);
                const key = CryptoJS.PBKDF2(password, salt, {
                    keySize: 256 / 32,
                    iterations: 100000,
                    hasher: CryptoJS.algo.SHA256
                });
                const fileNameBytes = new TextEncoder().encode(file.name);
                const fileData = new Uint8Array(buffer);
                const metaLength = fileNameBytes.length;
                const combinedData = new Uint8Array(2 + metaLength + fileData.length);
                combinedData[0] = (metaLength >> 8) & 0xff;
                combinedData[1] = metaLength & 0xff;
                combinedData.set(fileNameBytes, 2);
                combinedData.set(fileData, 2 + metaLength);
                const encrypted = CryptoJS.AES.encrypt(
                    arrayBufferToWordArray(combinedData.buffer),
                    key,
                    { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
                );
                const finalData = salt.clone().concat(iv).concat(encrypted.ciphertext);
                const encText = toBase85(finalData);
                const blob = new Blob([encText], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name + ".enc";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                alert("Файл успешно зашифрован.");
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }

        async function decryptFile() {
            const file = document.getElementById('fileInput').files[0];
            const password = document.getElementById('key').value;
            if (!file || !password) {
                alert("Выберите .enc файл и введите ключ.");
                return;
            }
            if (!file.name.endsWith(".enc")) {
                alert("Разрешены только файлы .enc");
                return;
            }
            try {
                const encryptedText = await file.text();
                const combined = fromBase85(encryptedText.trim());
                const salt = CryptoJS.lib.WordArray.create(combined.words.slice(0, 4), 16);
                const iv = CryptoJS.lib.WordArray.create(combined.words.slice(4, 8), 16);
                const cipherText = CryptoJS.lib.WordArray.create(combined.words.slice(8), combined.sigBytes - 32);
                const key = CryptoJS.PBKDF2(password, salt, {
                    keySize: 256 / 32,
                    iterations: 100000,
                    hasher: CryptoJS.algo.SHA256
                });
                const decrypted = CryptoJS.AES.decrypt(
                    { ciphertext: cipherText },
                    key,
                    { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
                );
                const bytes = wordArrayToUint8Array(decrypted);
                const fileNameLength = (bytes[0] << 8) | bytes[1];
                const fileName = new TextDecoder().decode(bytes.slice(2, 2 + fileNameLength));
                const fileContent = bytes.slice(2 + fileNameLength);
                const blob = new Blob([fileContent]);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                alert("Файл успешно дешифрован.");
            } catch (e) {
                alert("Неверный ключ или файл повреждён.");
            }
        }

        function updateCharCount() {
            const result = document.getElementById('resultText').value;
            document.getElementById('charCount').textContent = `Символов: ${result.length.toLocaleString('ru-RU')}`;
        }

        function downloadResultFile() {
            const result = document.getElementById('resultText').value;
            if (!result) {
                alert("Результат пуст. Сначала зашифруйте или дешифруйте текст.");
                return;
            }
            const blob = new Blob([result], { type: 'text/plain;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `result_${new Date().toISOString().slice(0, 10)}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
        }

        function copyToClipboard() {
            const resultTextarea = document.getElementById('resultText');
            resultTextarea.select();
            document.execCommand('copy');
            alert('Результат скопирован в буфер обмена!');
        }

        // НОВЫЕ ФУНКЦИИ ДЛЯ СТЕГАНОГРАФИИ

        function textToBits(text) {
            const encoder = new TextEncoder();
            const bytes = encoder.encode(text);
            const bits = [];
            for (let b of bytes) {
                for (let i = 7; i >= 0; i--) {
                    bits.push((b >> i) & 1);
                }
            }
            // Маркер конца: 16 нулевых бит
            for (let i = 0; i < 16; i++) bits.push(0);
            return bits;
        }

        function bitsToText(bits) {
            const bytes = [];
            for (let i = 0; i < bits.length; i += 8) {
                if (i + 8 > bits.length) break;
                let byte = 0;
                for (let j = 0; j < 8; j++) {
                    byte = (byte << 1) | bits[i + j];
                }
                bytes.push(byte);
                if (bytes.length >= 2 &&
                    bytes[bytes.length - 2] === 0 && bytes[bytes.length - 1] === 0) {
                    return new TextDecoder().decode(new Uint8Array(bytes.slice(0, -2)));
                }
            }
            return new TextDecoder().decode(new Uint8Array(bytes));
        }

        async function embedTextToPNG(imageFile, text) {
            // Используем createImageBitmap для точного контроля над цветом
            const bitmap = await createImageBitmap(imageFile, { colorSpaceConversion: 'none' });
            const canvas = document.createElement('canvas');
            canvas.width = bitmap.width;
            canvas.height = bitmap.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(bitmap, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            const bits = textToBits(text);
            const totalBits = data.length / 4 * 3; // только RGB
            if (bits.length > totalBits) {
                throw new Error(`Недостаточно места. Нужно ${bits.length} бит, доступно ${totalBits}.`);
            }

            let bitIndex = 0;
            for (let i = 0; i < data.length && bitIndex < bits.length; i += 4) {
                for (let ch = 0; ch < 3; ch++) {
                    if (bitIndex < bits.length) {
                        data[i + ch] = (data[i + ch] & 0xFE) | bits[bitIndex++];
                    }
                }
            }
            ctx.putImageData(imageData, 0, 0);

            return new Promise((resolve) => {
                canvas.toBlob(resolve, 'image/png');
            });
        }

        async function extractTextFromPNG(imageFile) {
            const bitmap = await createImageBitmap(imageFile, { colorSpaceConversion: 'none' });
            const canvas = document.createElement('canvas');
            canvas.width = bitmap.width;
            canvas.height = bitmap.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(bitmap, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            const bits = [];
            for (let i = 0; i < data.length; i += 4) {
                for (let ch = 0; ch < 3; ch++) {
                    bits.push(data[i + ch] & 1);
                }
            }
            return bitsToText(bits);
        }

        // Функция расшифровки извлечённого Base85
        function decryptBase85(base85text, password) {
            try {
                const combined = fromBase85(base85text);
                const salt = CryptoJS.lib.WordArray.create(combined.words.slice(0, 4), 16);
                const iv = CryptoJS.lib.WordArray.create(combined.words.slice(4, 8), 16);
                const cipherBytes = CryptoJS.lib.WordArray.create(combined.words.slice(8), combined.sigBytes - 32);
                const key = CryptoJS.PBKDF2(password, salt, {
                    keySize: 256 / 32,
                    iterations: 100000,
                    hasher: CryptoJS.algo.SHA256
                });
                const decrypted = CryptoJS.AES.decrypt(
                    { ciphertext: cipherBytes },
                    key,
                    { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
                );
                return decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) {
                throw new Error('Неверный ключ или повреждённые данные');
            }
        }

        // Обработчики для кнопок стеганографии
        async function hideToPNG() {
            const resultText = document.getElementById('resultText').value.trim();
            if (!resultText) {
                alert('Сначала зашифруйте текст, чтобы получить зашифрованную строку.');
                return;
            }
            const fileInput = document.getElementById('stegoFileInput');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Выберите PNG‑файл для встраивания.');
                return;
            }
            const file = fileInput.files[0];
            if (!file.type.startsWith('image/png')) {
                alert('Поддерживаются только PNG‑изображения.');
                return;
            }
            try {
                const blob = await embedTextToPNG(file, resultText);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'stego_' + file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                alert('Текст успешно спрятан в PNG. Файл скачан.');
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        }

        async function extractAndDecrypt() {
            const fileInput = document.getElementById('stegoFileInput');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Выберите PNG‑файл для извлечения.');
                return;
            }
            const file = fileInput.files[0];
            if (!file.type.startsWith('image/png')) {
                alert('Поддерживаются только PNG‑изображения.');
                return;
            }
            const password = document.getElementById('key').value.trim();
            if (!password) {
                alert('Введите ключ для расшифровки.');
                return;
            }
            try {
                const extracted = await extractTextFromPNG(file);
                console.log('Извлечено (сырое):', extracted); // для отладки
                if (!extracted) {
                    alert('Не удалось извлечь текст из изображения (возможно, нет скрытых данных).');
                    return;
                }
                const plaintext = decryptBase85(extracted, password);
                document.getElementById('resultText').value = plaintext;
                updateCharCount();
                alert('Текст успешно извлечён и расшифрован.');
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('resultText').addEventListener('input', updateCharCount);
        });
    </script>
</body>
